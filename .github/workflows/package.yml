name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ThinkCanvas.csproj --runtime win-x64

      - name: Publish
        run: >-
          dotnet publish ThinkCanvas.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/ThinkCanvas

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ThinkCanvas.csproj
          "value=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT

      - name: Create ZIP archive
        shell: pwsh
        run: Compress-Archive -Path artifacts/ThinkCanvas/* -DestinationPath "artifacts/ThinkCanvas-${{ steps.version.outputs.value }}-win-x64.zip"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ThinkCanvas-${{ steps.version.outputs.value }}-win-x64
          path: artifacts/ThinkCanvas-${{ steps.version.outputs.value }}-win-x64.zip
          if-no-files-found: error
