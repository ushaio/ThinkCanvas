name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ThinkCanvas.csproj --runtime win-x64 --source https://api.nuget.org/v3/index.json

      - name: Publish self-contained package
        run: >-
          dotnet publish ThinkCanvas.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --no-restore
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/ThinkCanvas

      - name: Publish framework-dependent package
        run: >-
          dotnet publish ThinkCanvas.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --no-restore
          -p:PublishSingleFile=true
          -p:DebugType=None
          -p:DebugSymbols=false
          --output artifacts/ThinkCanvas-framework-dependent

      - name: Read project version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content ThinkCanvas.csproj
          "value=$($project.Project.PropertyGroup.Version)" >> $env:GITHUB_OUTPUT

      - name: Read changelog release notes
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.value }}"
          $notes = @()
          $capture = $false
          foreach ($line in Get-Content CHANGELOG.md) {
            if ($line -match ("^## v" + [regex]::Escape($version) + "\b")) {
              $capture = $true
              continue
            }
            if ($capture -and $line -match "^## ") { break }
            if ($capture) { $notes += $line }
          }
          if ($notes.Count -eq 0) {
            $notes = @("See [CHANGELOG.md](https://github.com/ushaio/ThinkCanvas/blob/main/CHANGELOG.md) for details.")
          }
          ($notes -join "`n") | Set-Content -Path release-notes.md -Encoding utf8

      - name: Package artifacts
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/ThinkCanvas/* -DestinationPath "artifacts/ThinkCanvas-${{ steps.version.outputs.value }}-win-x64.zip"
          Copy-Item artifacts/ThinkCanvas-framework-dependent/ThinkCanvas.exe "artifacts/ThinkCanvas-${{ steps.version.outputs.value }}-win-x64-framework-dependent.exe"

      - name: Upload package
        uses: actions/upload-artifact@v5
        with:
          name: ThinkCanvas-${{ steps.version.outputs.value }}-win-x64
          path: |
            artifacts/ThinkCanvas-${{ steps.version.outputs.value }}-win-x64.zip
            artifacts/ThinkCanvas-${{ steps.version.outputs.value }}-win-x64-framework-dependent.exe
            artifacts/ThinkCanvas/ThinkCanvas.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "artifacts/ThinkCanvas-${{ steps.version.outputs.value }}-win-x64.zip"
          "artifacts/ThinkCanvas-${{ steps.version.outputs.value }}-win-x64-framework-dependent.exe"
          "artifacts/ThinkCanvas/ThinkCanvas.exe"
          --title "ThinkCanvas ${{ steps.version.outputs.value }}"
          --notes-file release-notes.md
          --generate-notes
